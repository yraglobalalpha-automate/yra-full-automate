name: Repair Shifted Content (one-off)

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "List targets without submitting (yes/no)"
        default: "yes"
      repair_limit:
        description: "Max repairs this run (0 = all)"
        default: "0"
      repair_skus:
        description: "Comma-separated SKUs to repair unconditionally (name may match)"
        required: false
        default: ""

# Reads the live OnBuy listings - shares the API quota/token with the sync,
# so queue behind it rather than overlapping (see run.yml for why).
concurrency:
  group: onbuy-api
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Probe live listings
        env:
          DRY_RUN: ${{ inputs.dry_run == 'no' && '0' || '1' }}
          REPAIR_LIMIT: ${{ inputs.repair_limit }}
          REPAIR_SKUS: ${{ inputs.repair_skus }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          ONBUY_USE_SANDBOX: ${{ vars.ONBUY_USE_SANDBOX }}
          ONBUY_CONSUMER_KEY: ${{ secrets.ONBUY_CONSUMER_KEY }}
          ONBUY_SECRET_KEY: ${{ secrets.ONBUY_SECRET_KEY }}
          ONBUY_TEST_CONSUMER_KEY: ${{ secrets.ONBUY_TEST_CONSUMER_KEY }}
          ONBUY_TEST_SECRET_KEY: ${{ secrets.ONBUY_TEST_SECRET_KEY }}
          ONBUY_SELLER_ID: ${{ secrets.ONBUY_SELLER_ID }}
          ONBUY_SITE_ID: ${{ secrets.ONBUY_SITE_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python repair_shifted_content.py
