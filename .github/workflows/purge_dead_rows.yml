name: Purge Dead eBay Rows (dry run / live)

# User 2026-10-12: "All the out of stock and brand blocked rows of eBay should be immediately deleted from store as well as sheet". The same script runs as the last step of
# the eBay sync (run.yml, every sync run); this manual form is for a dry run (default: report only) or a bigger one-off clean-up. See purge_dead_rows.py for the rules:
# a brand-blocked row, or a Stock-0 row eBay confirms is gone right now, is deleted from OnBuy first and then - copied to the tab "Purged <YYYY-MM>" - from the sheet.
# Rows on more than one sheet row, protected SKUs and SKUs on an open order are never touched.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "yes = report only (the eBay confirmation calls are still made); no = delete"
        required: false
        default: "yes"
      max_rows:
        description: "Most rows deleted in this run"
        required: false
        default: "200"
      max_ebay_checks:
        description: "Most eBay calls used to confirm out-of-stock rows"
        required: false
        default: "250"
      kinds:
        description: "brand,oos (comma-separated)"
        required: false
        default: "brand,oos"
      allow_mass:
        description: "yes = skip the 'implausibly many rows' breaker (a deliberate mass clean-up)"
        required: false
        default: "no"
      list_suspended:
        description: "yes = only list the purged SKUs whose OnBuy listing is suspended (OnBuy refuses to delete them); nothing else runs"
        required: false
        default: "no"

concurrency:
  group: onbuy-api
  cancel-in-progress: false

jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          pip install --upgrade pip
          pip install -r requirements.txt
      - name: Purge
        env:
          DRY_RUN: ${{ inputs.dry_run == 'no' && '0' || '1' }}
          MAX_ROWS: ${{ inputs.max_rows }}
          MAX_EBAY_CHECKS: ${{ inputs.max_ebay_checks }}
          KINDS: ${{ inputs.kinds }}
          ALLOW_MASS: ${{ inputs.allow_mass }}
          LIST_SUSPENDED: ${{ inputs.list_suspended }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
          ONBUY_USE_SANDBOX: ${{ vars.ONBUY_USE_SANDBOX }}
          ONBUY_CONSUMER_KEY: ${{ secrets.ONBUY_CONSUMER_KEY }}
          ONBUY_SECRET_KEY: ${{ secrets.ONBUY_SECRET_KEY }}
          ONBUY_TEST_CONSUMER_KEY: ${{ secrets.ONBUY_TEST_CONSUMER_KEY }}
          ONBUY_TEST_SECRET_KEY: ${{ secrets.ONBUY_TEST_SECRET_KEY }}
          ONBUY_SELLER_ID: ${{ secrets.ONBUY_SELLER_ID }}
          ONBUY_SITE_ID: ${{ secrets.ONBUY_SITE_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SMTP_HOST: ${{ vars.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT }}
          ALERT_EMAIL_FROM: ${{ vars.ALERT_EMAIL_FROM }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
        run: python purge_dead_rows.py
