name: Restore Manual Categories

on:
  workflow_dispatch:
    inputs:
      rows:
        description: "Row numbers/ranges to consider (empty = all rows)"
        required: false
        default: ""
      dry_run:
        description: "yes = report only; no = write restores"
        required: false
        default: "yes"

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          pip install --upgrade pip
          pip install -r requirements.txt
      - name: Restore
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          ROWS: ${{ inputs.rows }}
          DRY_RUN: ${{ inputs.dry_run == 'no' && '0' || '1' }}
        run: python restore_manual_categories.py
