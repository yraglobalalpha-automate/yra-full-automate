name: Ghost Listings (read-only)

# User 2026-10-15: the SKUs that show in the listing sweep but that OnBuy's by-SKU endpoints refuse ("SKU does not exist") - the facts for the
# support ticket (OPC, listing id, name, dates, the sheet row, a by-SKU lookup to show the refusal). Reads only; artifact ghost-listings.

on:
  workflow_dispatch:
    inputs:
      skus_file:
        description: "File with one SKU per line"
        required: false
        default: "cleanup/ghost_listings_2026-10-15.txt"
      lookups:
        description: "How many of the SKUs to look up one by one (filter[sku]) to show the refusal"
        required: false
        default: "15"

concurrency:
  group: onbuy-api
  cancel-in-progress: false

jobs:
  ghosts:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          pip install --upgrade pip
          pip install -r requirements.txt
      - name: Ghost listings (read-only)
        env:
          SKUS_FILE: ${{ inputs.skus_file }}
          LOOKUPS: ${{ inputs.lookups }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          ONBUY_USE_SANDBOX: ${{ vars.ONBUY_USE_SANDBOX }}
          ONBUY_CONSUMER_KEY: ${{ secrets.ONBUY_CONSUMER_KEY }}
          ONBUY_SECRET_KEY: ${{ secrets.ONBUY_SECRET_KEY }}
          ONBUY_TEST_CONSUMER_KEY: ${{ secrets.ONBUY_TEST_CONSUMER_KEY }}
          ONBUY_TEST_SECRET_KEY: ${{ secrets.ONBUY_TEST_SECRET_KEY }}
          ONBUY_SELLER_ID: ${{ secrets.ONBUY_SELLER_ID }}
          ONBUY_SITE_ID: ${{ secrets.ONBUY_SITE_ID }}
        run: python -u ghost_listings.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ghost-listings
          path: ghost_listings.csv
          if-no-files-found: warn
