name: Probe Product Endpoints (read-only)

# Reads OnBuy only (GET): for each SKU's OPC, what do the product reads answer and which of them show the product's pictures?
# Writes nothing. Uses the OnBuy token, so it queues in the onbuy-api group.

on:
  workflow_dispatch:
    inputs:
      skus:
        description: "SKUs, comma-separated (each is resolved to its OPC through a filtered listing read)"
        required: false
        default: ""
      opcs:
        description: "OPCs, comma-separated"
        required: false
        default: ""

concurrency:
  group: onbuy-api
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          pip install --upgrade pip
          pip install -r requirements.txt
      - name: Probe
        env:
          SKUS: ${{ inputs.skus }}
          OPCS: ${{ inputs.opcs }}
          ONBUY_USE_SANDBOX: ${{ vars.ONBUY_USE_SANDBOX }}
          ONBUY_CONSUMER_KEY: ${{ secrets.ONBUY_CONSUMER_KEY }}
          ONBUY_SECRET_KEY: ${{ secrets.ONBUY_SECRET_KEY }}
          ONBUY_SELLER_ID: ${{ secrets.ONBUY_SELLER_ID }}
          ONBUY_SITE_ID: ${{ secrets.ONBUY_SITE_ID }}
        run: python probe_product_endpoints.py
