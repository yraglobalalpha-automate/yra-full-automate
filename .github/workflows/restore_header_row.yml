name: Restore Header Row (one-off)

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Report what would change without writing (yes/no)"
        default: "yes"

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Repair the header row
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          DRY_RUN: ${{ inputs.dry_run == 'no' && '0' || '1' }}
        run: python restore_header_row.py
