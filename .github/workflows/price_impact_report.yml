name: Price Impact of Category Fees (read-only)

on:
  workflow_dispatch:
    inputs:
      tier_mode:
        description: "marginal = upper rate on the part above the threshold; step = upper rate on the whole price"
        required: false
        default: "marginal"

# Reads the sheet and the committed commission tables only - no OnBuy calls.

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          pip install --upgrade pip
          pip install -r requirements.txt
      - name: Report
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          FEE_TIER_MODE: ${{ inputs.tier_mode }}
        run: python price_impact_report.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: price-impact
          path: price_impact.csv
          if-no-files-found: warn
