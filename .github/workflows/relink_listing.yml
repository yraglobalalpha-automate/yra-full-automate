name: Relink Listings (guarded)

# Moves a listing that sits on a WRONG catalogue product onto the right one: the (zero-stock) listing is deleted, the same SKU is
# attached to the right OPC at stock 0, the result is re-read, then the new OPC is written into the sheet row. DRY RUN by default
# (read-only plan). The OPC must be the one OnBuy's queue answered for that SKU's own-content submission (repair_shifted_content.yml);
# it is checked against the queue history before anything is deleted. Holds the onbuy-api group.

on:
  workflow_dispatch:
    inputs:
      relink:
        description: "sku:opc pairs, comma-separated"
        required: true
      dry_run:
        description: "yes = read-only plan, no = do it"
        required: false
        default: "yes"
      blocked_skus:
        description: "SKUs that must not be touched (e.g. a listing with an open order)"
        required: false
        default: ""
      update_sheet:
        description: "Write the new OPC into the sheet row once the new listing verifies (yes/no)"
        required: false
        default: "yes"
      queue_pages:
        description: "Pages of 50 queue entries read to confirm the OPC"
        required: false
        default: "8"
      attach_only:
        description: "yes = resume for a SKU whose listing is already deleted (no delete, price from the sheet)"
        required: false
        default: "no"
      finish_only:
        description: "yes = the attach already worked: re-read, verify and write the sheet OPC only"
        required: false
        default: "no"

concurrency:
  group: onbuy-api
  cancel-in-progress: false

jobs:
  relink:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          pip install --upgrade pip
          pip install -r requirements.txt
      - name: Relink
        env:
          RELINK: ${{ inputs.relink }}
          DRY_RUN: ${{ inputs.dry_run == 'no' && '0' || '1' }}
          BLOCKED_SKUS: ${{ inputs.blocked_skus }}
          UPDATE_SHEET: ${{ inputs.update_sheet == 'no' && '0' || '1' }}
          QUEUE_PAGES: ${{ inputs.queue_pages }}
          ATTACH_ONLY: ${{ inputs.attach_only == 'yes' && '1' || '0' }}
          FINISH_ONLY: ${{ inputs.finish_only == 'yes' && '1' || '0' }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          ONBUY_USE_SANDBOX: ${{ vars.ONBUY_USE_SANDBOX }}
          ONBUY_CONSUMER_KEY: ${{ secrets.ONBUY_CONSUMER_KEY }}
          ONBUY_SECRET_KEY: ${{ secrets.ONBUY_SECRET_KEY }}
          ONBUY_TEST_CONSUMER_KEY: ${{ secrets.ONBUY_TEST_CONSUMER_KEY }}
          ONBUY_TEST_SECRET_KEY: ${{ secrets.ONBUY_TEST_SECRET_KEY }}
          ONBUY_SELLER_ID: ${{ secrets.ONBUY_SELLER_ID }}
          ONBUY_SITE_ID: ${{ secrets.ONBUY_SITE_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python relink_listing.py
