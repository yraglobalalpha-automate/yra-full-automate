name: Export Buy Box Decisions

on:
  workflow_dispatch:
    inputs:
      actions:
        description: "Actions to include, comma-separated (REPRICE, HELD, NO-COST, CHEAPER-NOT-WINNING) or ALL"
        required: false
        default: "REPRICE"

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          pip install --upgrade pip
          pip install -r requirements.txt
      - name: Export
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          ACTIONS: ${{ inputs.actions }}
          OUT: buybox_export.csv
        run: python export_buybox_tab.py
      - uses: actions/upload-artifact@v4
        with:
          name: buybox-export
          path: buybox_export.csv
