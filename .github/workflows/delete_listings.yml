name: Delete Listings By SKU

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "List SKUs without deleting (yes/no)"
        default: "yes"
      delete_skus:
        description: "Comma-separated SKUs to DELETE from OnBuy (required)"
        required: true

# Reads the live OnBuy listings - shares the API quota/token with the sync,
# so queue behind it rather than overlapping (see run.yml for why).
concurrency:
  group: onbuy-api
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Probe live listings
        env:
          DRY_RUN: ${{ inputs.dry_run == 'no' && '0' || '1' }}
          DELETE_SKUS: ${{ inputs.delete_skus }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          ONBUY_USE_SANDBOX: ${{ vars.ONBUY_USE_SANDBOX }}
          ONBUY_CONSUMER_KEY: ${{ secrets.ONBUY_CONSUMER_KEY }}
          ONBUY_SECRET_KEY: ${{ secrets.ONBUY_SECRET_KEY }}
          ONBUY_TEST_CONSUMER_KEY: ${{ secrets.ONBUY_TEST_CONSUMER_KEY }}
          ONBUY_TEST_SECRET_KEY: ${{ secrets.ONBUY_TEST_SECRET_KEY }}
          ONBUY_SELLER_ID: ${{ secrets.ONBUY_SELLER_ID }}
          ONBUY_SITE_ID: ${{ secrets.ONBUY_SITE_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python delete_listings.py
