name: Sale Price Guard

# 2026-10-10 (user: "the sale must not be displayed - the selling price is the direct price"): sweeps the account's listings, and for every one that
# carries a SALE price sends the update that ENDS it (its own sale price with a window in the past; no price, no stock) - OnBuy then drops the expired
# sale itself within a minute or two. dry_run=yes (default) only counts and describes them. Holds the onbuy-api group (GET sweep + a few PUTs).
# The nightly reconcile runs the same script on its shared sweep, so a sale that shows up again is ended the same night.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "yes = count and describe only; no = end the sales for real"
        required: false
        default: "yes"
      max_fix:
        description: "Listings to end in this run (0 = all)"
        required: false
        default: "0"
      verify_sample:
        description: "After a live run: how many ended listings to read back"
        required: false
        default: "5"
      verify_wait:
        description: "Seconds to wait before that read-back"
        required: false
        default: "150"
      from_run:
        description: "Run id of an earlier sale_guard / probe sweep whose sweep-dump artifact is used instead of sweeping again (saves the GET quota)"
        required: false
        default: ""
      skus:
        description: "BLIND mode (no sweep): SKUs, comma-separated - each gets the past-window update with a token sale price"
        required: false
        default: ""
      sku_file:
        description: "BLIND mode: path of a list file in the repo (one SKU per line)"
        required: false
        default: ""

permissions:
  contents: read
  actions: read

concurrency:
  group: onbuy-api
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          pip install --upgrade pip
          pip install -r requirements.txt
      - name: Fetch the sweep of an earlier run
        if: ${{ inputs.from_run != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          FROM_RUN: ${{ inputs.from_run }}
        run: gh run download "$FROM_RUN" --repo "${{ github.repository }}" -n sweep-dump -D earlier_sweep
      - name: Guard
        env:
          SWEEP_FILE: ${{ inputs.from_run != '' && 'earlier_sweep/sweep_dump.json' || '' }}
          MAX_FIX: ${{ inputs.max_fix }}
          VERIFY_SAMPLE: ${{ inputs.verify_sample }}
          VERIFY_WAIT: ${{ inputs.verify_wait }}
          DRY_INPUT: ${{ inputs.dry_run }}
          SKUS_INPUT: ${{ inputs.skus }}
          SKU_FILE_INPUT: ${{ inputs.sku_file }}
          DUMP: sweep_dump.json
          ONBUY_USE_SANDBOX: ${{ vars.ONBUY_USE_SANDBOX }}
          ONBUY_CONSUMER_KEY: ${{ secrets.ONBUY_CONSUMER_KEY }}
          ONBUY_SECRET_KEY: ${{ secrets.ONBUY_SECRET_KEY }}
          ONBUY_TEST_CONSUMER_KEY: ${{ secrets.ONBUY_TEST_CONSUMER_KEY }}
          ONBUY_TEST_SECRET_KEY: ${{ secrets.ONBUY_TEST_SECRET_KEY }}
          ONBUY_SELLER_ID: ${{ secrets.ONBUY_SELLER_ID }}
          ONBUY_SITE_ID: ${{ secrets.ONBUY_SITE_ID }}
          SMTP_HOST: ${{ vars.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT }}
          ALERT_EMAIL_FROM: ${{ vars.ALERT_EMAIL_FROM }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
        run: |
          if [ "$DRY_INPUT" = "no" ]; then export DRY_RUN=0; else export DRY_RUN=1; fi
          if [ -n "$SKUS_INPUT" ]; then echo "$SKUS_INPUT" | tr ',' ' ' | xargs -n1 > blind_skus.txt; export SKU_FILE=blind_skus.txt; fi
          if [ -n "$SKU_FILE_INPUT" ]; then export SKU_FILE="$SKU_FILE_INPUT"; fi
          python -u sale_guard.py
      - name: Upload the sweep
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: sweep-dump
          path: sweep_dump.json
          retention-days: 3
          if-no-files-found: ignore
