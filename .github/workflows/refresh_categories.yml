name: Refresh OnBuy Categories

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "yes = print diff + write onbuy_categories_only.new.csv as an artifact; no = overwrite the CSV (artifact too)"
        required: false
        default: "yes"

concurrency:
  group: onbuy-api
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          pip install --upgrade pip
          pip install -r requirements.txt
      - name: Refresh categories
        env:
          ONBUY_USE_SANDBOX: ${{ vars.ONBUY_USE_SANDBOX }}
          ONBUY_CONSUMER_KEY: ${{ secrets.ONBUY_CONSUMER_KEY }}
          ONBUY_SECRET_KEY: ${{ secrets.ONBUY_SECRET_KEY }}
          ONBUY_TEST_CONSUMER_KEY: ${{ secrets.ONBUY_TEST_CONSUMER_KEY }}
          ONBUY_TEST_SECRET_KEY: ${{ secrets.ONBUY_TEST_SECRET_KEY }}
          ONBUY_SELLER_ID: ${{ secrets.ONBUY_SELLER_ID }}
          ONBUY_SITE_ID: ${{ secrets.ONBUY_SITE_ID }}
          DRY_RUN: ${{ inputs.dry_run == 'no' && '0' || '1' }}
        run: python refresh_categories.py
      - name: Upload category CSV
        uses: actions/upload-artifact@v4
        with:
          name: onbuy-categories
          path: |
            onbuy_categories_only.csv
            onbuy_categories_only.new.csv
          if-no-files-found: ignore
