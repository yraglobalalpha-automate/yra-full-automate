name: YRA Removal (sheet rows + OnBuy listings)

# One run does both halves so nothing can interleave: remove the guarded rows
# from the product tabs (every row backed up first), then delete the same
# SKUs' listings from OnBuy in batches. dry_run=yes (default) only reports.
# Holds the onbuy-api group for the whole run - dispatch it when the group is
# idle (a pending run is replaced by a newer pending one).

on:
  workflow_dispatch:
    inputs:
      oos_list_file:
        description: "Repo path: the listed SKUs (one per line)"
        required: true
        default: "cleanup/yra_to_delete_2026-10-01.txt"
      remove_live_dups:
        description: "Also remove live duplicate rows (yes/no)"
        required: false
        default: "yes"
      dup_list_file:
        description: "Repo path: approved duplicate SKUs (empty = every live duplicate the rules allow)"
        required: false
        default: ""
      dry_run:
        description: "yes = report only; no = remove for real"
        required: false
        default: "yes"

permissions:
  contents: read

concurrency:
  group: onbuy-api
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Plan, back up and remove sheet rows
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          OOS_LIST_FILE: ${{ inputs.oos_list_file }}
          DUP_LIST_FILE: ${{ inputs.dup_list_file }}
          REMOVE_LIVE_DUPS: ${{ inputs.remove_live_dups }}
          DRY_INPUT: ${{ inputs.dry_run }}
        run: |
          if [ "$DRY_INPUT" = "no" ]; then export DRY_RUN=0; else export DRY_RUN=1; fi
          python bulk_remove_rows.py

      - name: Delete the removed SKUs' listings from OnBuy (batched)
        if: ${{ inputs.dry_run == 'no' }}
        env:
          DELETE_SKUS_FILE: onbuy_delete_list.txt
          DRY_RUN: "0"
          ONBUY_USE_SANDBOX: ${{ vars.ONBUY_USE_SANDBOX }}
          ONBUY_CONSUMER_KEY: ${{ secrets.ONBUY_CONSUMER_KEY }}
          ONBUY_SECRET_KEY: ${{ secrets.ONBUY_SECRET_KEY }}
          ONBUY_SELLER_ID: ${{ secrets.ONBUY_SELLER_ID }}
          ONBUY_SITE_ID: ${{ secrets.ONBUY_SITE_ID }}
        run: python delete_listings_batch.py

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: removal
          path: |
            removal_plan.csv
            onbuy_delete_list.txt
            delete_results.csv
