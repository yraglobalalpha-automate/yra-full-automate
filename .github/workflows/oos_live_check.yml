name: OOS Live Check (read-only)

# Sweeps the live OnBuy listings and compares their stock with the sheet.
# Writes a CSV artifact only. Shares the API token, so it queues in the
# onbuy-api group.

on:
  workflow_dispatch:

concurrency:
  group: onbuy-api
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          pip install --upgrade pip
          pip install -r requirements.txt
      - name: Check
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          ONBUY_USE_SANDBOX: ${{ vars.ONBUY_USE_SANDBOX }}
          ONBUY_CONSUMER_KEY: ${{ secrets.ONBUY_CONSUMER_KEY }}
          ONBUY_SECRET_KEY: ${{ secrets.ONBUY_SECRET_KEY }}
          ONBUY_SELLER_ID: ${{ secrets.ONBUY_SELLER_ID }}
          ONBUY_SITE_ID: ${{ secrets.ONBUY_SITE_ID }}
        run: python oos_live_check.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: oos-live-check
          path: oos_live_check.csv
