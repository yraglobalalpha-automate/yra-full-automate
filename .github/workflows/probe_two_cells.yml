name: Probe Two Cells

on:
  workflow_dispatch:
    inputs:
      rows:
        description: "Comma-separated sheet row numbers to inspect"
        required: false
        default: "2829,7926"

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          pip install --upgrade pip
          pip install -r requirements.txt
      - name: Probe
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          ROWS: ${{ inputs.rows }}
        run: python probe_two_cells.py
