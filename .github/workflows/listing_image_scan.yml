name: Listing Image Scan (read-only)

# Sweeps GET /v2/listings and counts the listings that show OnBuy's placeholder picture (= the product's images never
# made it onto OnBuy - the usual cause of a product page stuck loading). Writes nothing anywhere; the list of such
# listings comes back as an artifact. Holds the onbuy-api group (about 60 GETs) - dispatch when it is idle.

on:
  workflow_dispatch:
    inputs:
      sku_file:
        description: "Optional repo path of SKUs (one per line) to report on as well"
        required: false
        default: ""

concurrency:
  group: onbuy-api
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          pip install --upgrade pip
          pip install -r requirements.txt
      - name: Scan
        env:
          SKU_FILE: ${{ inputs.sku_file }}
          ONBUY_USE_SANDBOX: ${{ vars.ONBUY_USE_SANDBOX }}
          ONBUY_CONSUMER_KEY: ${{ secrets.ONBUY_CONSUMER_KEY }}
          ONBUY_SECRET_KEY: ${{ secrets.ONBUY_SECRET_KEY }}
          ONBUY_SELLER_ID: ${{ secrets.ONBUY_SELLER_ID }}
          ONBUY_SITE_ID: ${{ secrets.ONBUY_SITE_ID }}
        run: python listing_image_scan.py
      - name: Upload the list
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: no-image-listings
          path: out/
          if-no-files-found: ignore
