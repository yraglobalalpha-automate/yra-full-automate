name: Migrate Semi Rows (one-off)

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Report what would migrate without writing (yes/no)"
        default: "yes"
      include_suspended:
        description: "Also migrate rows whose listings are hidden (suspended) - blank OPC (yes/no)"
        default: "no"

# Reads the OnBuy listings for the OPC harvest - share the API quota.
concurrency:
  group: onbuy-api
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Migrate semi rows with harvested OPCs
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          ONBUY_USE_SANDBOX: ${{ vars.ONBUY_USE_SANDBOX }}
          ONBUY_CONSUMER_KEY: ${{ secrets.ONBUY_CONSUMER_KEY }}
          ONBUY_SECRET_KEY: ${{ secrets.ONBUY_SECRET_KEY }}
          ONBUY_TEST_CONSUMER_KEY: ${{ secrets.ONBUY_TEST_CONSUMER_KEY }}
          ONBUY_TEST_SECRET_KEY: ${{ secrets.ONBUY_TEST_SECRET_KEY }}
          ONBUY_SELLER_ID: ${{ secrets.ONBUY_SELLER_ID }}
          ONBUY_SITE_ID: ${{ secrets.ONBUY_SITE_ID }}
          DRY_RUN: ${{ inputs.dry_run == 'no' && '0' || '1' }}
          INCLUDE_SUSPENDED: ${{ inputs.include_suspended == 'yes' && '1' || '0' }}
        run: python migrate_semi_rows.py
