name: Listings Snapshot (read-only)

# One sweep of GET /v2/listings -> listings_snapshot.csv (sku, OPC, price, stock, created_at, updated_at, name, product_url).
# Writes nothing anywhere. Uses the OnBuy token, so it queues in the onbuy-api group.

on:
  workflow_dispatch:

concurrency:
  group: onbuy-api
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          pip install --upgrade pip
          pip install -r requirements.txt
      - name: Snapshot
        env:
          ONBUY_USE_SANDBOX: ${{ vars.ONBUY_USE_SANDBOX }}
          ONBUY_CONSUMER_KEY: ${{ secrets.ONBUY_CONSUMER_KEY }}
          ONBUY_SECRET_KEY: ${{ secrets.ONBUY_SECRET_KEY }}
          ONBUY_SELLER_ID: ${{ secrets.ONBUY_SELLER_ID }}
          ONBUY_SITE_ID: ${{ secrets.ONBUY_SITE_ID }}
        run: python listings_snapshot.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: listings-snapshot
          path: listings_snapshot.csv
          if-no-files-found: ignore
