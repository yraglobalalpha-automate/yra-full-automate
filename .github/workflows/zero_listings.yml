name: Zero Named Listings (cheap)

# Takes the stock off the named SKUs' live listings with one filtered read and one update each - no sweep of the whole account
# (zero_stock_mismatched.yml reads every listing: ~130 of OnBuy's 240 requests an hour). DRY RUN by default. Pair it with
# protected_skus.txt / hold_at_zero_skus.txt or the next sync restocks the listing.

on:
  workflow_dispatch:
    inputs:
      skus:
        description: "SKUs, comma-separated, exactly as on OnBuy"
        required: true
      dry_run:
        description: "yes = read and report only, no = set stock 0"
        required: false
        default: "yes"

concurrency:
  group: onbuy-api
  cancel-in-progress: false

jobs:
  zero:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          pip install --upgrade pip
          pip install -r requirements.txt
      - name: Zero
        env:
          SKUS: ${{ inputs.skus }}
          DRY_RUN: ${{ inputs.dry_run == 'no' && '0' || '1' }}
          ONBUY_USE_SANDBOX: ${{ vars.ONBUY_USE_SANDBOX }}
          ONBUY_CONSUMER_KEY: ${{ secrets.ONBUY_CONSUMER_KEY }}
          ONBUY_SECRET_KEY: ${{ secrets.ONBUY_SECRET_KEY }}
          ONBUY_SELLER_ID: ${{ secrets.ONBUY_SELLER_ID }}
          ONBUY_SITE_ID: ${{ secrets.ONBUY_SITE_ID }}
        run: python zero_listings.py
