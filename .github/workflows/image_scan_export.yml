name: Image Scan Export (read-only)

# Writes image_scan_input.csv (artifact): every in-stock sheet row with a live listing, its public product_url and the sheet's image links - the input of
# the image-404 scan and of the OnBuy support ticket. One listing sweep + two tab reads; writes nothing anywhere. Uses the OnBuy token (onbuy-api group).

on:
  workflow_dispatch:

concurrency:
  group: onbuy-api
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          pip install --upgrade pip
          pip install -r requirements.txt
      - name: Export
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          ONBUY_USE_SANDBOX: ${{ vars.ONBUY_USE_SANDBOX }}
          ONBUY_CONSUMER_KEY: ${{ secrets.ONBUY_CONSUMER_KEY }}
          ONBUY_SECRET_KEY: ${{ secrets.ONBUY_SECRET_KEY }}
          ONBUY_TEST_CONSUMER_KEY: ${{ secrets.ONBUY_TEST_CONSUMER_KEY }}
          ONBUY_TEST_SECRET_KEY: ${{ secrets.ONBUY_TEST_SECRET_KEY }}
          ONBUY_SELLER_ID: ${{ secrets.ONBUY_SELLER_ID }}
          ONBUY_SITE_ID: ${{ secrets.ONBUY_SITE_ID }}
        run: python -u image_scan_export.py
      - uses: actions/upload-artifact@v4
        with:
          name: image-scan-input
          path: image_scan_input.csv
