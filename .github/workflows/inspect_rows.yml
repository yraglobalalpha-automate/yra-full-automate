name: Inspect Rows (read-only)

on:
  workflow_dispatch:
    inputs:
      rows:
        description: "Row numbers/ranges, e.g. 4442-4444,4514-4531"
        required: false
        default: ""
      skus:
        description: "Comma-separated SKUs to resolve to rows (in addition to rows)"
        required: false
        default: ""
      scan_all:
        description: "Sweep the whole sheet for description/neighbour-title shifts"
        required: false
        default: "false"
      fetch_onbuy:
        description: "Fetch live OnBuy name + public page description for the ROWS' SKUs"
        required: false
        default: "false"

concurrency:
  group: onbuy-api
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          pip install --upgrade pip
          pip install -r requirements.txt
      - name: Inspect
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          ONBUY_USE_SANDBOX: ${{ vars.ONBUY_USE_SANDBOX }}
          ONBUY_CONSUMER_KEY: ${{ secrets.ONBUY_CONSUMER_KEY }}
          ONBUY_SECRET_KEY: ${{ secrets.ONBUY_SECRET_KEY }}
          ONBUY_TEST_CONSUMER_KEY: ${{ secrets.ONBUY_TEST_CONSUMER_KEY }}
          ONBUY_TEST_SECRET_KEY: ${{ secrets.ONBUY_TEST_SECRET_KEY }}
          ONBUY_SELLER_ID: ${{ secrets.ONBUY_SELLER_ID }}
          ONBUY_SITE_ID: ${{ secrets.ONBUY_SITE_ID }}
          ROWS: ${{ inputs.rows }}
          SKUS: ${{ inputs.skus }}
          SCAN_ALL: ${{ inputs.scan_all }}
          FETCH_ONBUY: ${{ inputs.fetch_onbuy }}
        run: python inspect_rows.py
